name: Find Duplicate Candidates

on:
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan for duplicate-identity candidates
        run: |
          python scraper/find_duplicate_candidates.py \
            --input data/faculty.json \
            --aliases scraper/name_aliases.json
