name: Scrape UNC SOM Faculty Data

on:
  schedule:
    # Every Sunday at 3am UTC (11pm Saturday ET)
    - cron: "0 3 * * 0"
  workflow_dispatch:
    # Also allow manual trigger from GitHub Actions UI
    inputs:
      department_filter:
        description: "Only scrape departments matching this string (leave blank for all)"
        required: false
        default: ""
      skip_nih:
        description: "Skip NIH RePORTER step to save time"
        required: false
        default: "false"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run scraper
        run: |
          python scraper/scrape.py \
            --config scraper/departments.json \
            --output data/faculty.json \
            ${{ github.event.inputs.skip_nih == 'true' && '--skip-nih' || '' }} \
            ${{ github.event.inputs.department_filter != '' && format('--dept "{0}"', github.event.inputs.department_filter) || '' }}

      - name: Check output
        run: |
          echo "Faculty data file:"
          wc -l data/faculty.json
          python -c "
          import json
          with open('data/faculty.json') as f:
              d = json.load(f)
          print(f'Total faculty: {d[\"total_faculty\"]}')
          print(f'Departments: {len(d[\"departments\"])}')
          print(f'Generated at: {d[\"generated_at\"]}')
          "

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/faculty.json
          git diff --staged --quiet || git commit -m "Update faculty data [$(date -u '+%Y-%m-%d')]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
