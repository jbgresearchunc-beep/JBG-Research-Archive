name: Scrape UNC SOM Faculty Data

on:
  schedule:
    # Every Sunday at 3am UTC (11pm Saturday ET)
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      department_filter:
        description: "Only scrape departments matching this string (leave blank for all)"
        required: false
        default: ""
      skip_nih:
        description: "Skip NIH RePORTER step to save time"
        required: false
        default: "false"
      scrape_only:
        description: "Only run Steps 1+2 (scrape + profile visits), skip PubMed/NIH"
        required: false
        default: "false"
      enrich_only:
        description: "Only run Steps 3+4 (PubMed + NIH) using existing faculty_raw.json"
        required: false
        default: "false"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Step 1+2 — Scrape faculty pages and profile visits
        if: ${{ github.event.inputs.enrich_only != 'true' }}
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          python scraper/scrape.py \
            --config scraper/departments.json \
            --raw-output data/faculty_raw.json \
            --scrape-only \
            ${{ github.event.inputs.department_filter != '' && format('--dept "{0}"', github.event.inputs.department_filter) || '' }}

      - name: Commit faculty_raw.json
        if: ${{ github.event.inputs.enrich_only != 'true' && github.event.inputs.scrape_only != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/faculty_raw.json
          git diff --staged --quiet || git commit -m "Update faculty_raw [$(date -u '+%Y-%m-%d')]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Step 3+4 — PubMed and NIH enrichment
        if: ${{ github.event.inputs.scrape_only != 'true' }}
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          python scraper/scrape.py \
            --config scraper/departments.json \
            --raw-output data/faculty_raw.json \
            --output data/faculty.json \
            --enrich-only \
            ${{ github.event.inputs.skip_nih == 'true' && '--skip-nih' || '' }} \
            ${{ github.event.inputs.department_filter != '' && format('--dept "{0}"', github.event.inputs.department_filter) || '' }}

      - name: Check output
        if: ${{ github.event.inputs.scrape_only != 'true' }}
        run: |
          python -c "
          import json
          with open('data/faculty.json') as f:
              d = json.load(f)
          print(f'Total faculty: {d[\"total_faculty\"]}')
          print(f'Departments: {len(d[\"departments\"])}')
          print(f'Generated at: {d[\"generated_at\"]}')
          "

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/faculty_raw.json data/faculty.json
          git diff --staged --quiet || git commit -m "Update faculty data [$(date -u '+%Y-%m-%d')]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
