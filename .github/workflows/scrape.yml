name: Scrape UNC SOM Faculty Data

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      department_filter:
        description: "TEST a single department (e.g. 'Cardiology', 'ENT'). Writes to faculty_test.json, does NOT touch the real data. Leave blank for a full production run."
        required: false
        default: ""
      scrape_only:
        description: "Only run Steps 1+2 (scrape + profile visits), skip PubMed"
        required: false
        default: "false"
      enrich_only:
        description: "Only run Step 3 (PubMed) using existing faculty_raw.json"
        required: false
        default: "false"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Determine file paths (test vs production)
        id: paths
        env:
          DEPT_FILTER: ${{ github.event.inputs.department_filter }}
        run: |
          # A department filter means this is a TEST run — use separate files
          # so we never overwrite the full production dataset.
          if [ -n "$DEPT_FILTER" ]; then
            echo "raw=data/faculty_test_raw.json" >> "$GITHUB_OUTPUT"
            echo "out=data/faculty_test.json" >> "$GITHUB_OUTPUT"
            echo "is_test=true" >> "$GITHUB_OUTPUT"
            echo "This is a TEST run for '$DEPT_FILTER' → writing to faculty_test*.json"
          else
            echo "raw=data/faculty_raw.json" >> "$GITHUB_OUTPUT"
            echo "out=data/faculty.json" >> "$GITHUB_OUTPUT"
            echo "is_test=false" >> "$GITHUB_OUTPUT"
            echo "This is a PRODUCTION run → writing to faculty.json"
          fi

      - name: Step 1+2 — Scrape faculty pages and profile visits
        if: ${{ github.event.inputs.enrich_only != 'true' }}
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          DEPT_FILTER: ${{ github.event.inputs.department_filter }}
        run: |
          DEPT_ARG=""
          if [ -n "$DEPT_FILTER" ]; then
            DEPT_ARG="--dept $DEPT_FILTER"
          fi
          python scraper/scrape.py \
            --config scraper/departments.json \
            --raw-output ${{ steps.paths.outputs.raw }} \
            --scrape-only \
            $DEPT_ARG

      - name: Commit faculty_raw.json (production only)
        if: ${{ github.event.inputs.enrich_only != 'true' && github.event.inputs.scrape_only != 'true' && steps.paths.outputs.is_test == 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/faculty_raw.json
          git diff --staged --quiet || git commit -m "Update faculty_raw [$(date -u '+%Y-%m-%d')]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Step 3 — PubMed enrichment
        if: ${{ github.event.inputs.scrape_only != 'true' }}
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          DEPT_FILTER: ${{ github.event.inputs.department_filter }}
        run: |
          DEPT_ARG=""
          if [ -n "$DEPT_FILTER" ]; then
            DEPT_ARG="--dept $DEPT_FILTER"
          fi
          python scraper/scrape.py \
            --config scraper/departments.json \
            --raw-output ${{ steps.paths.outputs.raw }} \
            --output ${{ steps.paths.outputs.out }} \
            --enrich-only \
            $DEPT_ARG

      - name: Step 4 — Build research collaborator networks
        if: ${{ github.event.inputs.scrape_only != 'true' }}
        run: |
          python scraper/build_collaborators.py \
            --input ${{ steps.paths.outputs.out }} \
            --output ${{ steps.paths.outputs.out }} \
            --students scraper/student_researchers.json

      - name: Check output
        if: ${{ github.event.inputs.scrape_only != 'true' }}
        run: |
          python -c "
          import json
          with open('${{ steps.paths.outputs.out }}') as f:
              d = json.load(f)
          print(f'Total faculty: {d[\"total_faculty\"]}')
          print(f'Departments: {len(d[\"departments\"])}')
          print(f'Generated at: {d[\"generated_at\"]}')
          with_collab = sum(1 for f in d['faculty'] if f.get('collaborators'))
          print(f'Faculty with collaborators: {with_collab}')
          flagged = sum(1 for f in d['faculty'] if f.get('has_student_coauthor'))
          print(f'Faculty flagged with student co-authors: {flagged}')
          "

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ steps.paths.outputs.raw }} ${{ steps.paths.outputs.out }}
          git diff --staged --quiet || git commit -m "Update faculty data [$(date -u '+%Y-%m-%d')]${{ steps.paths.outputs.is_test == 'true' && ' (TEST)' || '' }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
