name: Discover Department URLs

on:
  workflow_dispatch:  # manual trigger only

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run URL discovery
        run: python scraper/discover_urls.py
